# Historical one-epoch smoke configuration. The current formal E7 protocol uses
# configs/experiments/fer2013_resnet18_e7_clean.yaml (224 x 224, 50 epochs).
project:
  name: occlusion-fer

dataset:
  name: fer2013
  path: /path/to/fer2013.csv
  image_size: 112
  num_classes: 7

model:
  name: resnet18
  pretrained: true

training:
  mode: clean
  seed: 42
  epochs: 1
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: auto

output:
  directory: outputs/smoke
