project:
  name: occlusion-fer
  experiment_name: e3_regularization

dataset:
  name: fer2013
  path: /path/to/fer2013.csv
  image_size: 112
  num_classes: 7
  augmentation:
    type: none

model:
  name: resnet18
  pretrained: true

training:
  mode: clean
  seed: 2026
  epochs: 30
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.001
  num_workers: 4
  device: cuda
  loss:
    type: cross_entropy
    label_smoothing: 0.1
  scheduler:
    type: none
    warmup_epochs: 0
    warmup_start_factor: 1.0
    min_learning_rate: 0.0001
  early_stopping:
    enabled: false
    patience: 8

output:
  directory: outputs/screening/e3_regularization
