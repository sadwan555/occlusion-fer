project:
  name: occlusion-fer
  experiment_name: e1_warmup_cosine

dataset:
  name: fer2013
  path: /path/to/fer2013.csv
  image_size: 112
  num_classes: 7

model:
  name: resnet18
  pretrained: true

training:
  mode: clean
  seed: 2026
  epochs: 30
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  device: cuda
  scheduler:
    type: warmup_cosine
    warmup_epochs: 3
    warmup_start_factor: 0.1
    min_learning_rate: 0.000001
  early_stopping:
    enabled: false
    patience: 8

output:
  directory: outputs/screening/e1_warmup_cosine
