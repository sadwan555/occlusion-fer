[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occlusion-fer"
version = "0.1.0"
description = "Reproducible FER2013 ResNet-18 experiments under synthetic occlusion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "torch>=2.5,<2.6",
    "torchvision>=0.20,<0.21",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
paper = [
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
occlusion_fer = ["paper.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
