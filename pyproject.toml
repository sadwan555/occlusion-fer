[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occlusion-fer"
version = "0.1.0"
description = "Minimal configuration foundation for occlusion-robust FER research."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "torch>=2.2,<3",
    "torchvision>=0.28,<0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
